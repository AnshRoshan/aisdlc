name: publish cli

# Publishes the arsdlc CLI to npm. Preferred path: npm trusted publishing (no secret at all) - add
# this repo, workflow and environment as a trusted publisher on the npm package page, and leave
# NPM_TOKEN unset. If the account cannot use trusted publishing, set NPM_TOKEN and the mode step
# switches to the token path; npm refuses --provenance for token auth, so that path publishes unsigned.
#
# The switch is a step output, not an `if` that reads `secrets`: GitHub does not expose the
# `secrets` context in a job-level or step-level `if`, and a workflow that tries fails to parse and
# never runs at all. The token reaches npm through `env:` on its own step, because `arsdlc scan`
# flags an inline `TOKEN=...` assignment and this repo has to pass its own gates.
#
# Trigger: push a version tag (git tag vX.Y.Z && git push --tags) or run the workflow manually.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write   # OIDC identity for npm trusted publishing; short-lived, never stored

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm test
        working-directory: packages/cli
      - name: choose the publish path
        id: mode
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "using=token" >> "$GITHUB_OUTPUT"
            echo "::notice::publishing with NPM_TOKEN; npm refuses --provenance for token auth"
          else
            echo "using=oidc" >> "$GITHUB_OUTPUT"
            echo "::notice::publishing through npm trusted publishing with provenance"
          fi
      - name: publish through npm trusted publishing
        if: steps.mode.outputs.using == 'oidc'
        run: npm publish --access public --provenance
        working-directory: packages/cli
      - name: publish with the automation token
        if: steps.mode.outputs.using == 'token'
        run: npm publish --access public
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: create a GitHub release for version tags
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
