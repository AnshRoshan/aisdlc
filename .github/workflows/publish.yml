name: publish cli

# Publishes the aisdlc CLI to npm. Requires one secret:
#   NPM_TOKEN - an npm automation token (npmjs.com -> Access Tokens -> Generate)
# Trigger: push a version tag (git tag vX.Y.Z && git push --tags) or run the workflow manually.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm test
        working-directory: packages/cli
      - run: npm publish --access public
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: create a GitHub release for version tags
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
