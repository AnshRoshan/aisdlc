name: publish cli

# Publishes the aisdlc CLI to npm. Preferred: npm trusted publishing (no secret) - add the GitHub
# action as a trusted publisher on the npm package page. NPM_TOKEN remains a fallback: when the
# secret is set it is used instead, and provenance is skipped because npm refuses it for tokens.
# Trigger: push a version tag (git tag vX.Y.Z && git push --tags) or run the workflow manually.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # npm trusted publishing needs a short-lived OIDC identity, not a token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm test
        working-directory: packages/cli
      - name: publish with provenance (trusted publishing)
        if: ${{ secrets.NPM_TOKEN == '' }}
        run: npm publish --access public --provenance
        working-directory: packages/cli
      - name: publish with the automation token
        if: ${{ secrets.NPM_TOKEN != '' }}
        run: npm publish --access public
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: create a GitHub release for version tags
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
