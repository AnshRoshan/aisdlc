<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title id="title">aisdlc stages and gates</title>
  <desc id="desc">Discover, specify, plan, tasks, build, verify, accept, release and operate; DONE follows required gates. Lanes decide which of six gates apply.</desc>
  <rect x="16" y="16" width="1168" height="268" rx="22" fill="#10151f" stroke="#1e2836"/>

  <text x="64" y="60" font-size="11" letter-spacing="2" fill="#7d8ea6">THE GATE MODEL</text>
  <text x="64" y="86" font-size="16" fill="#e6edf3" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-weight="600">Nine stages, then DONE. Six gates. No evidence, no progress.</text>

  <!-- Gates align with plan→tasks, tasks→build, verify→accept, accept→release, release→operate, operate→DONE. -->
  <g font-size="11" text-anchor="middle">
    <g fill="none" stroke="#22c55e">
      <rect x="357" y="104" width="32" height="22" rx="6"/><rect x="469" y="104" width="32" height="22" rx="6"/>
      <rect x="693" y="104" width="32" height="22" rx="6"/><rect x="805" y="104" width="32" height="22" rx="6"/>
      <rect x="917" y="104" width="32" height="22" rx="6"/><rect x="1029" y="104" width="32" height="22" rx="6"/>
    </g>
    <g fill="#22c55e">
      <text x="373" y="119">G1</text><text x="485" y="119">G2</text><text x="709" y="119">G3</text>
      <text x="821" y="119">G4</text><text x="933" y="119">G5</text><text x="1045" y="119">G6</text>
    </g>
    <g stroke="#22c55e" opacity="0.5">
      <line x1="373" y1="126" x2="373" y2="140"/><line x1="485" y1="126" x2="485" y2="140"/>
      <line x1="709" y1="126" x2="709" y2="140"/><line x1="821" y1="126" x2="821" y2="140"/>
      <line x1="933" y1="126" x2="933" y2="140"/><line x1="1045" y1="126" x2="1045" y2="140"/>
    </g>
  </g>

  <g font-size="12.5" text-anchor="middle">
    <g fill="#0b0f16" stroke="#1e2836">
      <rect x="48" y="140" width="90" height="44" rx="8"/><rect x="160" y="140" width="90" height="44" rx="8"/>
      <rect x="272" y="140" width="90" height="44" rx="8"/><rect x="384" y="140" width="90" height="44" rx="8"/>
      <rect x="496" y="140" width="90" height="44" rx="8"/><rect x="608" y="140" width="90" height="44" rx="8"/>
      <rect x="720" y="140" width="90" height="44" rx="8"/><rect x="832" y="140" width="90" height="44" rx="8"/>
      <rect x="944" y="140" width="90" height="44" rx="8"/><rect x="1056" y="140" width="90" height="44" rx="8"/>
    </g>
    <g fill="#9aa8ba">
      <text x="93" y="167">discover</text><text x="205" y="167">spec</text><text x="317" y="167">plan</text>
      <text x="429" y="167">tasks</text><text x="653" y="167">verify</text><text x="765" y="167">accept</text>
      <text x="877" y="167">release</text><text x="989" y="167">operate</text><text x="1101" y="167">DONE</text>
    </g>
    <rect x="496" y="140" width="90" height="44" rx="8" fill="#22c55e" stroke="#22c55e"/>
    <text x="541" y="167" fill="#0b0f16" font-weight="600">build</text>
    <g fill="#7d8ea6" font-size="14">
      <text x="149" y="167">→</text><text x="261" y="167">→</text><text x="373" y="167">→</text>
      <text x="485" y="167">→</text><text x="597" y="167">→</text><text x="709" y="167">→</text>
      <text x="821" y="167">→</text><text x="933" y="167">→</text><text x="1045" y="167">→</text>
    </g>
  </g>

  <g font-size="12">
    <text x="64" y="228"><tspan fill="#22c55e">G1</tspan><tspan fill="#9aa8ba"> plan approval</tspan></text>
    <text x="340" y="228"><tspan fill="#22c55e">G2</tspan><tspan fill="#9aa8ba"> artifact consistency</tspan></text>
    <text x="660" y="228"><tspan fill="#22c55e">G3</tspan><tspan fill="#9aa8ba"> merge safety</tspan></text>
    <text x="64" y="252"><tspan fill="#22c55e">G4</tspan><tspan fill="#9aa8ba"> acceptance proof</tspan></text>
    <text x="340" y="252"><tspan fill="#22c55e">G5</tspan><tspan fill="#9aa8ba"> release approval</tspan></text>
    <text x="660" y="252"><tspan fill="#22c55e">G6</tspan><tspan fill="#9aa8ba"> runtime guardrails</tspan></text>
    <text x="1136" y="252" fill="#7d8ea6" text-anchor="end">lane decides which gates apply</text>
  </g>
</svg>
