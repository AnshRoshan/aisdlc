# The CLI has zero runtime dependencies, so the only npm surface is the site build.
# Actions are the real risk here: every workflow runs on `ubuntu-latest` with a write-scoped token
# for Pages, and a broken action pins the release plumbing silently.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "18:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(ci)

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      astro-and-deps:
        patterns:
          - "*"
    commit-message:
      prefix: chore(site)
