name: arsdlc gate

# The enforcement layer for harnesses that have no native hook, and the merge check for all of them.
# `arsdlc ci` evaluates every gate the work has already crossed, plus any gate a human has signed,
# and exits non-zero on a regression, a stale approval or a tree that moved after a signature.
#
# Callers add their own trigger and either call this job or copy the file:
#   on: pull_request
#   jobs: { gates: { uses: AnshRoshan/arsdlc/.github/workflows/gates.yml@v1 } }
# Branch protection then requires the "gates" check, so an agent cannot merge past a red gate by
# describing it as green in the PR body. It is not wired to this repo's own pull requests: the
# kit dogfoods the command in ci.yml, scoped to the feature that is actually in progress.

on:
  workflow_call:
    inputs:
      feature:
        description: "Limit to one feature slug; empty checks every feature"
        required: false
        type: string
        default: ""
      version:
        description: "arsdlc version to run"
        required: false
        type: string
        default: "latest"
  workflow_dispatch:
    inputs:
      feature:
        description: "Limit to one feature slug; empty checks every feature"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: evaluate every gate the work has crossed
        env:
          AISDLC_VERSION: ${{ inputs.version || 'latest' }}
          AISDLC_FEATURE: ${{ inputs.feature || '' }}
        run: |
          if [ -f packages/cli/bin/arsdlc.js ]; then
            node packages/cli/bin/arsdlc.js ci ${AISDLC_FEATURE:+"$AISDLC_FEATURE"}
          else
            npx --yes "arsdlc@${AISDLC_VERSION}" ci ${AISDLC_FEATURE:+"$AISDLC_FEATURE"}
          fi
      # SARIF upload arrives with `arsdlc export --format sarif`; a findings file that does not exist
      # yet must not become a step that silently uploads nothing.
