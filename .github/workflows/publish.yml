name: publish cli

# Publishes the arsdlc CLI to npm. Preferred path: npm trusted publishing (no secret at all) - add
# this repo, workflow and environment as a trusted publisher on the npm package page, and leave
# NPM_TOKEN unset. If the account cannot use trusted publishing, set NPM_TOKEN and the mode step
# switches to the token path; npm refuses --provenance for token auth, so that path publishes unsigned.
#
# The switch is a step output, not an `if` that reads `secrets`: GitHub does not expose the
# `secrets` context in a job-level or step-level `if`, and a workflow that tries fails to parse and
# never runs at all. The token reaches npm through `env:` on its own step, because `arsdlc scan`
# flags an inline `TOKEN=...` assignment and this repo has to pass its own gates.
#
# Trigger: push a version tag (git tag vX.Y.Z && git push --tags) or run the workflow manually.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write   # OIDC identity for npm trusted publishing; short-lived, never stored

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm test
        working-directory: packages/cli
      - name: the tag must name the version, and the version must not already be published
        id: preflight
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "v$VERSION" ]; then
            echo "::error::tag $REF_NAME does not match packages/cli/package.json version $VERSION"
            exit 1
          fi
          if npm view "arsdlc@${VERSION}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::arsdlc@${VERSION} is already on the registry; skipping the publish"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "arsdlc@${VERSION} is not on the registry yet"
          fi
        # Two failures this prevents, both real here. A tag whose version does not match the manifest
        # published nothing and left a release pointing at the wrong tree. And a retry of a version that
        # is already out reaches npm's PUT, is refused, and by then the job has written a signed
        # provenance statement for that version to the Sigstore transparency log - a public, permanent
        # attestation for a build that does not exist. Check the registry first, and do not attest at all
        # when there is nothing to publish.
      - name: choose the publish path
        id: mode
        if: steps.preflight.outputs.already == 'false'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "using=token" >> "$GITHUB_OUTPUT"
            echo "::notice::publishing with NPM_TOKEN; npm refuses --provenance for token auth"
          else
            echo "using=oidc" >> "$GITHUB_OUTPUT"
            echo "::notice::publishing through npm trusted publishing with provenance"
          fi
      - name: publish through npm trusted publishing
        if: steps.preflight.outputs.already == 'false' && steps.mode.outputs.using == 'oidc'
        run: npm publish --access public --provenance
        working-directory: packages/cli
      - name: publish with the automation token
        if: steps.preflight.outputs.already == 'false' && steps.mode.outputs.using == 'token'
        run: npm publish --access public
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: create a GitHub release for version tags
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
